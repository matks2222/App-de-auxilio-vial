# Configuración para publicar la app en Render (render.com) con un solo paso: New > Blueprint > tu repositorio.
# Render te pedirá escribir ADMIN_PASSWORD y CODIGO_COLABORADORES al crear el servicio.
services:
  - type: web
    name: auxilio-vial
    runtime: python
    plan: starter                    # el plan gratuito no sirve: se duerme y borra el disco (se perderían tus QR)
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: para que la app sepa que llega por https. Una sola instancia: pedidos y repartidores viven en memoria.
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /salud
    disk:
      name: datos
      mountPath: /var/data           # aquí vive despacho.db: tus QR, precios, costos y tiempos reales
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DESPACHO_DB
        value: /var/data/despacho.db
      - key: ADMIN_PASSWORD          # tu contraseña para /panel, /qr y /negocio (elige una larga)
        sync: false
      - key: CODIGO_COLABORADORES    # el código que les das a repartidores y talleres para registrarse
        sync: false
      - key: SECRET_KEY
        generateValue: true
