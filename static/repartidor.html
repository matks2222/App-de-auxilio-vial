<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repartidor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="/static/estilo.css?v=13"></head><body>
<header><h1>Repartidor de auxilio vial</h1><a href="/">Inicio</a></header>
<div id="mapa"></div>
<div id="leyenda" class="sub" style="padding:4px 12px"></div>

<div id="registro" class="tarjeta" style="display:none">
  <h2>Regístrate</h2>
  <label for="nombre">Tu nombre completo (lo verá el cliente)</label><input id="nombre" maxlength="60" placeholder="Nombre y apellido" autocomplete="name">
  <div id="bloqueVehiculo">
    <label for="vTipo">Tu vehículo</label><select id="vTipo"></select>
    <div id="bloqueModelo"><label for="vModelo">Marca y modelo</label><input id="vModelo" maxlength="30" autocomplete="off" placeholder="Ej. Italika FT150"></div>
    <div id="bloquePlaca"><label for="vPlaca">Placa</label><input id="vPlaca" maxlength="12" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="Ej. ABC123D" style="text-transform:uppercase;font-weight:bold;letter-spacing:2px"></div>
    <label for="vColor">Color</label><select id="vColor"></select>
    <div class="sub" style="margin-top:4px">El cliente verá tu nombre, tu vehículo y tu placa para reconocerte. Escribe tus datos reales.</div>
  </div>
  <div id="bloqueCodigo" style="display:none"><label>Código de acceso (te lo da el administrador)</label><input id="codigo" maxlength="100" autocomplete="off"></div>
  <div id="repReto" style="display:none;margin-top:8px" class="tarjeta"><b>Verificación de seguridad</b><div id="repRetoPregunta" style="font-size:18px;margin:6px 0"></div><input id="repRetoResp" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="Tu respuesta" style="font-size:18px"></div>
  <div id="bloquePrestador"><label>¿Cómo vas a participar?</label><select id="prestador"></select></div>
  <div id="notaPrestador" class="sub" style="margin-top:4px"></div>
  <label>Servicios que puedes dar (marca solo lo que traigas contigo y sepas hacer con seguridad)</label>
  <div id="habilidades"></div>
  <div id="errorReg" class="alerta" style="display:none"></div>
  <button id="btnRegistro" style="width:100%;margin-top:10px">Guardar</button>
</div>

<div id="principal" class="tarjeta" style="display:none">
  <div class="fila" style="align-items:center">
    <div><div id="miNombre" class="estado"></div><div id="miEstado" class="sub"></div><div id="miVehiculo" class="sub"></div></div>
    <button id="btnTurno" style="max-width:150px"></button>
  </div>
  <div id="espera" class="aviso" style="display:none"></div>
  <div id="posInfo" class="sub" style="margin-top:6px"></div>
  <div id="error" class="alerta" style="display:none"></div>
</div>

<div id="oferta" class="tarjeta" style="display:none"></div>
<div id="trabajo" class="tarjeta" style="display:none"></div>
<div class="pie">La app no procesa pagos: cobra exactamente lo que vio el cliente. Si la situación es peligrosa, no te detengas y llama al 911.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="/static/comun.js?v=13"></script>
<script>
const mapa = crearMapa("mapa");
const $ = (id) => document.getElementById(id);
$("leyenda").textContent = LEYENDA;
let mid = localStorage.getItem("mid"), pos = null, marcaYo = null, marcaCli = null, watch = null, cancelarSub = null, snapActual = null, tmr = null;
let config = null, expiraEn = null, ultimaFirma = null, notaGuardada = "";
api("/api/talleres").then((ts) => marcarTalleres(mapa, ts)).catch(() => {});

function pintarHabilidades() {
  const p = $("prestador").value, info = config.prestadores[p];
  $("notaPrestador").textContent = p === "repartidor" ? "No necesitas ser mecánico. Llevas gasolina, una bomba para las llantas o cables de corriente hasta donde está el cliente."
    : "Llevas el auto al taller cuando no se puede reparar en el lugar.";
  $("habilidades").innerHTML = info.permitidas.map((k) =>
    `<label style="display:flex;gap:8px;align-items:center;color:#222;margin:4px 0"><input type="checkbox" value="${k}" ${info.por_defecto.includes(k) ? "checked" : ""} style="width:auto"> ${esc(config.tipos[k])}</label>`).join("");
}
api("/api/config").then((c) => {
  config = c;
  $("prestador").innerHTML = Object.entries(c.prestadores).map(([k, v]) => `<option value="${k}">${esc(v.nombre)}</option>`).join("");
  $("prestador").onchange = pintarHabilidades;
  $("vTipo").innerHTML = Object.entries(c.tipos_vehiculo).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");
  $("vColor").innerHTML = c.colores.map((k) => `<option value="${k}">${esc(k.charAt(0).toUpperCase() + k.slice(1))}</option>`).join("");
  $("vTipo").onchange = () => { const sin = ["bicicleta", "a_pie"].includes($("vTipo").value); $("bloquePlaca").style.display = sin ? "none" : "block"; $("bloqueModelo").style.display = sin ? "none" : "block"; };
  $("bloqueCodigo").style.display = c.requiere_codigo ? "block" : "none";
  $("bloquePrestador").style.display = Object.keys(c.prestadores).length > 1 ? "block" : "none";     // con un solo rol no hay nada que elegir
  pintarHabilidades();
});

$("btnRegistro").onclick = async () => {
  const hab = [...document.querySelectorAll("#habilidades input:checked")].map((i) => i.value);
  if ($("nombre").value.trim().replace(/\s+/g, " ").length < 2) { $("errorReg").textContent = "Escribe tu nombre completo: el cliente lo verá para saber quién llega."; $("errorReg").style.display = "block"; return; }
  try {
    const r = await api("/api/repartidores", "POST", { ...datosReto({ bloque: "repReto", pregunta: "repRetoPregunta", respuesta: "repRetoResp" }), codigo: $("codigo").value, nombre: $("nombre").value, habilidades: hab, prestador: $("prestador").value,
      vehiculo: { tipo: $("vTipo").value, color: $("vColor").value, placa: $("vPlaca").value, modelo: $("vModelo").value } });
    mid = r.id; localStorage.setItem("mid", mid); arrancar();
  } catch (e) { pedirReto(e, { bloque: "repReto", pregunta: "repRetoPregunta", respuesta: "repRetoResp" }); $("errorReg").textContent = e.message; $("errorReg").style.display = "block"; }
};

function fijarPos(lat, lon, enviar = true) {
  pos = { lat, lon };
  if (marcaYo) marcaYo.setLatLng([lat, lon]); else marcaYo = L.marker([lat, lon], { icon: pin("📍", "#2f6fdb") }).addTo(mapa);
  $("posInfo").textContent = `Tu ubicación: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
  if (enviar && snapActual && snapActual.repartidor && snapActual.repartidor.estado !== "fuera") api(`/api/repartidores/${mid}/ubicacion`, "POST", { lat, lon }).catch(() => {});
}
mapa.on("click", (e) => { if (!watch) fijarPos(e.latlng.lat, e.latlng.lng); });   // modo manual si no hay GPS
function iniciarGPS() {
  if (watch || !navigator.geolocation) return;
  watch = navigator.geolocation.watchPosition((p) => fijarPos(p.coords.latitude, p.coords.longitude),
    () => { navigator.geolocation.clearWatch(watch); watch = null; mostrarError("Sin GPS (en el celular hace falta HTTPS). Toca el mapa para marcar tu ubicación."); },
    { enableHighAccuracy: true, maximumAge: 3000 });
}
function mostrarError(t) { $("error").textContent = t; $("error").style.display = "block"; }

$("btnTurno").onclick = async () => {
  $("error").style.display = "none"; prepararSonido();      // el clic permite que el navegador deje sonar el aviso después
  const activo = snapActual.repartidor.estado === "fuera";
  try {
    if (activo) { iniciarGPS(); await new Promise((r) => setTimeout(r, 400)); }
    if (activo && !pos) return mostrarError("Marca tu ubicación: espera al GPS o toca el mapa.");
    await api(`/api/repartidores/${mid}/turno`, "POST", { activo, lat: pos ? pos.lat : null, lon: pos ? pos.lon : null });
  } catch (e) { mostrarError(e.message); }
};

function arrancar() {
  $("registro").style.display = "none";
  if (cancelarSub) cancelarSub();
  cancelarSub = suscribir("repartidor", mid, pintar);
  if (!tmr) tmr = setInterval(() => { if (pos && snapActual && snapActual.repartidor && snapActual.repartidor.estado !== "fuera") api(`/api/repartidores/${mid}/ubicacion`, "POST", pos).catch(() => {}); }, 4000);
  setInterval(cuentaAtras, 1000);
}
function cuentaAtras() {
  const el = document.getElementById("cuenta");
  if (el && expiraEn !== null) el.textContent = Math.max(0, Math.round((expiraEn - Date.now()) / 1000)) + " s";
}

function pintar(snap) {
  snapActual = snap;
  const m = snap.repartidor, s = snap.solicitud;
  if (!m) { localStorage.removeItem("mid"); mid = null; location.reload(); return; }
  if (s && s.expira_en_s != null) expiraEn = Date.now() + s.expira_en_s * 1000;
  $("principal").style.display = "block";
  $("miNombre").textContent = `${ICONO_PRESTADOR[m.prestador]} ${m.nombre}`;
  const nombres = { fuera: "Fuera de turno", libre: "En turno: esperando solicitudes", ofertado: "Tienes una oferta", ocupado: "Atendiendo un servicio" };
  $("miEstado").textContent = `${NOMBRE_PRESTADOR[m.prestador]} · ${nombres[m.estado]} · servicios: ${m.servicios}`;
  const v = m.vehiculo;
  $("miVehiculo").textContent = v ? `${{ moto: "Moto", auto: "Auto", bicicleta: "Bicicleta", a_pie: "A pie" }[v.tipo] || "Vehículo"}${v.modelo ? " " + v.modelo : ""} · ${v.color}${v.placa ? " · placa " + v.placa : ""}` : "";
  $("btnTurno").textContent = m.estado === "fuera" ? "Entrar en turno" : "Salir de turno";
  $("btnTurno").className = m.estado === "fuera" ? "ok" : "sec";
  $("btnTurno").disabled = m.estado === "ocupado";
  pintarEspera(m);
  if (m.estado !== "fuera" && !pos && m.lat != null) fijarPos(m.lat, m.lon, false);
  if (m.estado !== "fuera") iniciarGPS();
  if (marcaCli && !s) { mapa.removeLayer(marcaCli); marcaCli = null; }
  if (s) {
    if (marcaCli) marcaCli.setLatLng([s.lat, s.lon]); else marcaCli = L.marker([s.lat, s.lon], { icon: pin("🚗", "#d9534f") }).addTo(mapa);
    if (pos) mapa.fitBounds([[s.lat, s.lon], [pos.lat, pos.lon]], { padding: [40, 40], maxZoom: 16 });
  }
  // las tarjetas solo se redibujan cuando cambia algo relevante (así no se borra lo que estás escribiendo)
  const firma = JSON.stringify([m.estado, s && s.id, s && s.estado, m.opciones_escalar, s && s.cotizacion && s.cotizacion.total]);
  if (firma === ultimaFirma) return;
  ultimaFirma = firma;
  $("oferta").style.display = "none"; $("trabajo").style.display = "none";
  $("oferta").innerHTML = ""; $("trabajo").innerHTML = "";     // limpia las tarjetas ocultas para no dejar botones viejos
  if (m.estado === "ofertado" && s) {
    $("oferta").style.display = "block";
    $("oferta").innerHTML = `<h2>Nueva solicitud</h2>
      <div class="estado">${esc(s.tipo_texto)}</div>
      <div class="sub">Llegarías en ~${fmtEta(s.eta_s)}${s.lugar ? "<br>📍 Punto: " + esc(s.lugar) : ""}${s.notas ? "<br>Notas: " + esc(s.notas) : ""}</div>
      ${bloquePedido(s)}
      <div class="sub" style="margin:6px 0">Responde en <b id="cuenta"></b></div>
      <div class="fila"><button class="mal" id="btnNo">Rechazar</button><button class="ok" id="btnSi">Aceptar</button></div>`;
    $("btnSi").onclick = () => responder(s.id, true); $("btnNo").onclick = () => responder(s.id, false);
    cuentaAtras(); avisarOferta();
  }
  if (m.estado === "ocupado" && s) {
    const enSitio = s.estado === "en_sitio";
    const taller = s.tipo === "grua" && s.taller ? `<div class="aviso">🛠️ Lleva el auto a: <b>${esc(s.taller.nombre)}</b> (a ${s.taller.distancia_km.toFixed(1)} km) · <a href="https://www.google.com/maps/dir/?api=1&destination=${s.taller.lat},${s.taller.lon}" target="_blank" rel="noopener">ruta</a></div>` : "";
    let botones = `<label for="pin">PIN de seguridad que te da el cliente (4 dígitos)</label>
      <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="····" style="font-size:28px;letter-spacing:10px;text-align:center;font-weight:bold">
      <button class="ok" id="btnAvance" style="width:100%;margin-top:8px">Ya llegué con el cliente</button>
      <div class="sub" style="margin-top:4px">Pídele el PIN cuando estés con él: sin el PIN no se puede empezar el servicio.</div>`;
    if (enSitio) {
      const op = m.opciones_escalar || [];
      botones = `${op.length ? `<label>Diagnóstico (obligatorio si escalas)</label><textarea id="nota" rows="2" maxlength="300" placeholder="Qué encontraste"></textarea>` : ""}
        <button class="ok" id="btnResuelto" style="width:100%;margin-top:8px">✅ Listo, ya quedó</button>
        ${op.includes("escalar_grua") ? `<div class="fila" style="margin-top:8px"><button class="mal" id="btnEscGrua">Falla mayor: pedir grúa</button></div>` : ""}`;
    }
    $("trabajo").style.display = "block";
    const vc = s.vehiculo_cliente;
    const autoCliente = vc ? `<div class="aviso" style="font-size:16px">👤 Cliente: <b>${esc(s.cliente_nombre || "")}</b><br>🚗 Busca un auto <b>${esc(vc.color)}</b> con placa <b style="font-size:20px;letter-spacing:2px">${esc(vc.placa)}</b><br><span class="sub">Confirma que la placa y el nombre coinciden antes de entregar nada.</span></div>` : "";
    $("trabajo").innerHTML = `<h2>${enSitio ? "Atendiendo" : "Ve hacia el cliente"}</h2>
      ${autoCliente}
      <div class="estado">${esc(s.tipo_texto)}</div>
      <div class="sub">${s.lugar ? "📍 Punto: " + esc(s.lugar) : ""}${s.notas ? "<br>Notas: " + esc(s.notas) : ""}</div>
      ${taller}${enSitio ? "" : bloquePedido(s)}${enSitio && s.cotizacion ? `<div class="aviso">🧾 Cobra al cliente: <b>${fmtMXN(s.cotizacion.total)}</b> (${esc(s.cotizacion.concepto)}, ya incluye el servicio a domicilio). Es el precio que vio el cliente: no cobres de más. La app no procesa pagos.</div>` : ""}
      <div style="margin:8px 0"><a href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}" target="_blank" rel="noopener">Abrir ruta al cliente en Google Maps</a></div>${botones}`;
    const ir = async (accion) => {
      const nota = $("nota") ? $("nota").value.trim() : "";
      if (accion.startsWith("escalar") && !nota) return mostrarError("Escribe el diagnóstico antes de escalar.");
      const pin = $("pin") ? $("pin").value.trim() : "";
      if (accion === "llegue" && !/^[0-9]{4}$/.test(pin)) return mostrarError("Pídele al cliente su PIN de 4 dígitos para marcar que llegaste.");
      try { await api(`/api/repartidores/${mid}/estado`, "POST", { accion, nota, pin }); } catch (e) { mostrarError(e.message); }
    };
    if ($("btnAvance")) $("btnAvance").onclick = () => ir("llegue");
    if ($("btnResuelto")) $("btnResuelto").onclick = () => ir("termine");
    if ($("btnEscGrua")) $("btnEscGrua").onclick = () => ir("escalar_grua");
  }
}
// Por qué a veces no llega nada: aquí se ve si hay pedidos esperando cerca, lejos o en pausa
function pintarEspera(m) {
  const e = m.espera, el = $("espera"), pl = (n, a, b) => `${n} ${n === 1 ? a : b}`;
  if (!e || m.estado !== "libre") { el.style.display = "none"; return; }
  const partes = [];
  if (e.cerca) partes.push(`Hay ${pl(e.cerca, "pedido", "pedidos")} en tu zona: en unos segundos te llega la oferta.`);
  if (e.lejos) partes.push(`Hay ${pl(e.lejos, "pedido", "pedidos")} a más de ${e.radio_km} km de ti: acércate para recibirlos.`);
  if (e.pausa) partes.push(`${pl(e.pausa, "pedido que rechazaste volverá", "pedidos que rechazaste volverán")} a ofrecerse en unos minutos si nadie más los toma.`);
  el.innerHTML = partes.join("<br>"); el.style.display = partes.length ? "block" : "none";
}
// Aviso sonoro y vibración cuando llega una oferta (el celular en el bolsillo o la pestaña en segundo plano no se entera de otra forma)
let audio = null, tituloOriginal = document.title;
function prepararSonido() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch (e) {} }
function avisarOferta() {
  try { if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {}
  if (audio) for (let i = 0; i < 3; i++) {
    const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime + i * 0.35;
    o.frequency.value = 880; g.gain.setValueAtTime(0.25, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.25);
    o.connect(g); g.connect(audio.destination); o.start(t0); o.stop(t0 + 0.28);
  }
  document.title = "🔔 Nueva solicitud"; setTimeout(() => { document.title = tituloOriginal; }, 15000);
}
// Qué hay que llevar, dónde conseguirlo y cuánto cobrar
function bloquePedido(s) {
  const c = s.cotizacion;
  if (!c) return "";
  const ruta = (x) => ` · <a href="https://www.google.com/maps/dir/?api=1&destination=${x.lat},${x.lon}" target="_blank" rel="noopener">ruta al taller</a>`;
  let lleva, donde = "";
  if (s.tipo === "aire_llantas") lleva = "tu bomba para llantas";
  else if (s.tipo === "paso_de_corriente") lleva = "tus cables pasacorriente";
  else {
    lleva = c.concepto;
    donde = c.taller ? `<br>Consíguela en <b>${esc(c.taller.nombre)}</b>${c.taller.direccion ? " (" + esc(c.taller.direccion) + ")" : ""}${c.taller.telefono ? " · tel. " + esc(c.taller.telefono) : ""}${ruta(c.taller)}`
      : "<br>Cómprala en una gasolinera de camino, en un recipiente homologado para combustible.";
  }
  return `<div class="aviso" style="margin-top:8px">📦 Lleva: <b>${esc(lleva)}</b>${donde}<br>Cobro al cliente: <b>${fmtMXN(c.total)}</b></div>`;
}
async function responder(sid, acepta) { try { await api(`/api/repartidores/${mid}/respuesta`, "POST", { solicitud_id: sid, acepta }); } catch (e) { mostrarError(e.message); } }

if (mid) arrancar(); else $("registro").style.display = "block";
</script></body></html>
