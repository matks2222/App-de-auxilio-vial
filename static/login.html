<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/static/estilo.css?v=13"></head><body>
<header><h1>Administración</h1></header>
<div class="tarjeta" style="max-width:420px;margin:24px auto">
  <h2>Iniciar sesión</h2>
  <div class="sub">Esta sección es solo para el administrador.</div>
  <label for="password">Contraseña</label>
  <input id="password" type="password" autocomplete="current-password" maxlength="200" autofocus>
  <label style="display:flex;gap:8px;align-items:center;margin-top:8px;color:#222"><input type="checkbox" id="ver" style="width:auto"> Mostrar contraseña</label>
  <div id="error" class="alerta" style="display:none"></div>
  <button id="entrar" class="btn-grande" style="margin-top:12px">Entrar</button>
</div>
<script>
const $ = (id) => document.getElementById(id);
// Solo se acepta volver a una ruta de este mismo sitio (evita redirecciones a otros dominios).
function destino() {
  const n = new URLSearchParams(location.search).get("next") || "";
  return /^\/[A-Za-z0-9_\-\/.]*$/.test(n) && !n.startsWith("//") ? n : "/menu";
}
async function entrar() {
  $("error").style.display = "none"; $("entrar").disabled = true;
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("password").value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "No se pudo iniciar sesión");
    location.href = destino();
  } catch (e) { $("error").textContent = e.message; $("error").style.display = "block"; $("entrar").disabled = false; $("password").select(); }
}
$("ver").onchange = () => { $("password").type = $("ver").checked ? "text" : "password"; };
$("entrar").onclick = entrar;
$("password").onkeydown = (e) => { if (e.key === "Enter") entrar(); };
</script></body></html>
